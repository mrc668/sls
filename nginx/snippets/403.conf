# Inside your server {} block
error_page 418 /custom_418.html;
location = /custom_418.html {
    internal;
    # This captures the header we will set in ModSecurity
    add_header Content-Type "text/html" always;
    return 418 "<html><body><h1>Access Denied</h1><p>Tell the support desk $request_id</p></body></html>";
}
#
# Catch internal Nginx 400 errors and send them to the named location
error_page 400 403 404 500 =444 @silent_drop;

location @silent_drop {
    return 444;
}
